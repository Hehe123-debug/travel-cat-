<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅行小猫</title>
<style>
:root{
  --brown:#6b5140;
  --wood:#e0b184;
  --pink:#ffb3c1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(circle at 15% 0%, #fff2e0 0%, transparent 55%),
    radial-gradient(circle at 85% 100%, #ffe0cc 0%, transparent 55%),
    linear-gradient(160deg,#ffeeda,#ffd9c2);
  color:var(--brown);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:26px 16px 50px;
  min-height:100%;
}

/* ============ 布局 ============ */
.app{
  display:flex;gap:26px;align-items:flex-start;
  width:100%;max-width:980px;
}
.panel{
  width:224px;flex:none;display:flex;flex-direction:column;gap:12px;
  position:sticky;top:26px;
}
.brand{
  display:flex;align-items:center;gap:8px;
  font-size:19px;font-weight:800;letter-spacing:2px;
  padding:0 4px 6px;color:#7a5c46;
}
.brand .paw{font-size:20px;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}

.btn{
  display:flex;align-items:center;gap:12px;
  padding:13px 15px;border:none;border-radius:18px;
  background:#fff;
  box-shadow:0 4px 0 #eccfb6, 0 8px 18px rgba(180,130,95,.12);
  cursor:pointer;font-family:inherit;color:var(--brown);
  text-align:left;transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #eccfb6,0 12px 22px rgba(180,130,95,.16)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #eccfb6}
.btn .ico{font-size:22px;line-height:1;flex:none}
.btn b{display:block;font-size:15px;font-weight:700}
.btn small{display:block;font-size:11.5px;color:#a98d78;margin-top:2px;font-weight:400}

.stage{display:flex;flex-direction:column;align-items:center;gap:16px;flex:1;min-width:0}

/* ============ 房子 ============ */
.house{
  position:relative;
  width:460px;height:640px;flex:none;
  border-radius:30px;
  background:#fff8f0;
  box-shadow:
    0 0 0 10px #fff,
    0 0 0 13px #f0dcc8,
    0 26px 50px rgba(170,115,80,.28);
  overflow:hidden;
  display:flex;flex-direction:column;
}
.floor{position:relative;overflow:hidden;flex:1}
.floor.up{background:linear-gradient(180deg,#fffaf3 0%,#ffefe2 100%)}
.floor.down{background:linear-gradient(180deg,#fff4ea 0%,#ffe7d4 100%)}

/* 墙纸圆点 */
.floor.up::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,#ffd9c0 1.6px,transparent 1.7px);
  background-size:36px 36px;opacity:.55;
}
/* 地板 */
.floor::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:24px;z-index:0;
  background:repeating-linear-gradient(90deg,#e9c8a4 0 62px,#dcb68c 62px 64px);
  border-top:3px solid #d3a577;
  box-shadow:0 -5px 12px rgba(190,150,115,.16);
}
.divider{
  height:14px;flex:none;position:relative;z-index:3;
  background:linear-gradient(180deg,#eccda9,#d3a577);
  box-shadow:0 3px 8px rgba(150,110,80,.25);
}

/* ---- 二楼：窗户 ---- */
.window{
  position:absolute;left:168px;top:30px;width:124px;height:120px;
  border-radius:16px;background:#3a3560;
  border:7px solid #fffaf3;
  box-shadow:0 0 0 3px #e8cdb0, 0 8px 16px rgba(160,120,90,.25);
  overflow:hidden;z-index:1;
}
.window::before,.window::after{content:'';position:absolute;background:#fffaf3;opacity:.9}
.window::before{left:50%;top:0;bottom:0;width:5px;transform:translateX(-50%)}
.window::after{top:50%;left:0;right:0;height:5px;transform:translateY(-50%)}
.moon{
  position:absolute;right:12px;top:10px;width:24px;height:24px;border-radius:50%;
  background:#ffe9a8;box-shadow:0 0 20px #ffe9a8;
}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 2.2s infinite}
.star:nth-child(2){animation-delay:.4s}
.star:nth-child(3){animation-delay:.9s}
.star:nth-child(4){animation-delay:1.4s}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

/* ---- 墙上的小画 ---- */
.wallpic{
  position:absolute;left:64px;top:46px;width:64px;height:64px;z-index:1;
  border-radius:12px;background:#fff;
  border:5px solid #f3d0ab;
  display:grid;place-items:center;font-size:26px;
  box-shadow:0 5px 12px rgba(170,130,95,.18);
  transform:rotate(-4deg);
}

/* ---- 床 ---- */
.bed{position:absolute;left:24px;bottom:26px;width:204px;height:108px;z-index:1}
.bed-head{
  position:absolute;left:0;bottom:0;width:22px;height:104px;
  border-radius:12px 12px 4px 4px;
  background:linear-gradient(90deg,#dcaa72,#c9915f);
}
.bed-mattress{
  position:absolute;left:10px;bottom:16px;width:194px;height:60px;border-radius:16px;
  background:#fff6ea;
  box-shadow:inset 0 -6px 0 #f2e2ce, 0 5px 10px rgba(170,130,95,.2);
}
.bed-pillow{
  position:absolute;left:26px;bottom:46px;width:52px;height:30px;border-radius:14px;
  background:#fff;box-shadow:inset 0 -4px 0 #f5e6d6, 0 2px 5px rgba(170,130,95,.18);
}
.bed-blanket{
  position:absolute;left:88px;bottom:16px;width:116px;height:56px;
  border-radius:14px 16px 16px 14px;
  background:linear-gradient(180deg,#ffc6d2,#ff9fb4);
  box-shadow:inset 0 -5px 0 rgba(255,255,255,.35);
}

/* ---- 落地镜 ---- */
.mirror{position:absolute;left:292px;bottom:26px;width:118px;height:170px;z-index:1}
.mirror-glass{
  position:absolute;inset:0;bottom:22px;
  border-radius:58px 58px 14px 14px;
  background:linear-gradient(150deg,#d7ecfa 0%,#f2fbff 45%,#cfe4f5 100%);
  border:9px solid #f0c9a0;
  box-shadow:0 8px 18px rgba(170,130,95,.24), inset 0 0 26px rgba(255,255,255,.9);
}
.mirror-glass::after{
  content:'';position:absolute;left:16px;top:20px;width:22px;height:70px;
  border-radius:12px;background:rgba(255,255,255,.75);
  transform:rotate(14deg);filter:blur(2px);
}
.mirror-foot{
  position:absolute;left:8px;right:8px;bottom:0;height:20px;
  border-radius:8px;background:linear-gradient(180deg,#e6b98d,#d09a68);
}

/* ---- 梳妆台 ---- */
.vanity{position:absolute;left:26px;bottom:26px;width:200px;height:170px;z-index:1}
.vanity-mirror{
  position:absolute;left:52px;bottom:80px;width:96px;height:90px;
  border-radius:48px 48px 12px 12px;
  background:linear-gradient(150deg,#d7ecfa 0%,#f2fbff 50%,#cfe4f5 100%);
  border:8px solid #f0c9a0;
  box-shadow:0 6px 14px rgba(170,130,95,.22), inset 0 0 20px rgba(255,255,255,.9);
}
.vanity-mirror::after{
  content:'';position:absolute;left:12px;top:14px;width:16px;height:40px;
  border-radius:10px;background:rgba(255,255,255,.8);transform:rotate(14deg);
}
.vanity-top{
  position:absolute;left:0;bottom:66px;width:200px;height:14px;border-radius:8px;
  background:linear-gradient(180deg,#f5d4b2,#dfb287);
  box-shadow:0 4px 8px rgba(170,130,95,.2);
}
.vanity-drawer{
  position:absolute;left:16px;bottom:20px;width:168px;height:46px;
  border-radius:10px;background:#f9e0c6;border:2px solid #e9c5a0;
}
.vanity-drawer i{
  position:absolute;top:50%;width:26px;height:6px;border-radius:3px;
  background:#e0b184;transform:translateY(-50%);
}
.vanity-drawer i:nth-child(1){left:24px}
.vanity-drawer i:nth-child(2){right:24px}
.vanity-legs i{position:absolute;bottom:0;width:10px;height:22px;border-radius:4px;background:#d9a066}
.vanity-legs i:nth-child(1){left:26px}
.vanity-legs i:nth-child(2){right:26px}
.bottle{
  position:absolute;left:146px;bottom:80px;width:16px;height:24px;
  border-radius:5px 5px 8px 8px;
  background:linear-gradient(180deg,#ffc2cf,#ff9fb4);
  box-shadow:0 -6px 0 -4px #e0b184;
}

/* ---- 椅子 ---- */
.chair{position:absolute;left:246px;bottom:26px;width:96px;height:120px;z-index:1}
.chair-back{
  position:absolute;left:0;bottom:56px;width:22px;height:64px;
  border-radius:12px 12px 4px 4px;
  background:linear-gradient(90deg,#e8bd92,#d9a066);
}
.chair-seat{
  position:absolute;left:0;bottom:46px;width:88px;height:14px;border-radius:8px;
  background:linear-gradient(180deg,#f5d4b2,#dfb287);
  box-shadow:0 4px 8px rgba(170,130,95,.22);
}
.chair-legs i{position:absolute;bottom:0;width:9px;height:48px;border-radius:4px;background:#d9a066}
.chair-legs i:nth-child(1){left:14px}
.chair-legs i:nth-child(2){right:14px}

/* ---- 植物 ---- */
.plant{
  position:absolute;right:24px;bottom:24px;font-size:62px;line-height:1;z-index:1;
  filter:drop-shadow(0 5px 8px rgba(170,130,95,.25));
}
/* ---- 地毯 ---- */
.rug{
  position:absolute;left:130px;bottom:12px;width:190px;height:42px;border-radius:50%;
  background:rgba(255,196,210,.4);z-index:0;
}
.rug.small{left:60px;width:150px;background:rgba(200,230,220,.45)}

/* ---- 行李箱（旅行中） ---- */
.suitcase{
  position:absolute;left:352px;bottom:30px;font-size:46px;line-height:1;z-index:1;
  animation:bob 3s ease-in-out infinite;
  filter:drop-shadow(0 5px 8px rgba(170,130,95,.3));
}

/* ---- 小猫 ---- */
.cat-wrap{
  position:absolute;z-index:6;pointer-events:none;
  animation:bob 2.6s ease-in-out infinite;
}
.cat-wrap svg{width:100%;height:auto;display:block;filter:drop-shadow(0 7px 8px rgba(180,130,95,.25))}
.cat-wrap.sleep{animation:bobSlow 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes bobSlow{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.02)}}

.zzz{
  position:absolute;font-size:15px;font-weight:800;color:#c2a288;
  animation:floatZ 2.6s ease-out infinite;opacity:0;
}
.zzz.z1{left:70%;top:-6%}
.zzz.z2{left:84%;top:-20%;font-size:19px;animation-delay:.9s}
.zzz.z3{left:98%;top:-34%;font-size:13px;animation-delay:1.7s}
@keyframes floatZ{
  0%{opacity:0;transform:translateY(6px) scale(.7)}
  25%{opacity:1}
  100%{opacity:0;transform:translateY(-16px) scale(1.15)}
}

/* ============ 状态条 ============ */
.status{
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.8);
  padding:11px 20px;border-radius:999px;
  font-size:14px;color:#7a5c46;font-weight:600;
  box-shadow:0 6px 16px rgba(180,130,95,.15);
  max-width:100%;text-align:center;
}
.pulse{
  width:9px;height:9px;border-radius:50%;background:#7fd6a6;flex:none;
  box-shadow:0 0 0 0 rgba(127,214,166,.6);
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(127,214,166,.6)}
  70%{box-shadow:0 0 0 10px rgba(127,214,166,0)}
  100%{box-shadow:0 0 0 0 rgba(127,214,166,0)}
}

/* ============ 弹窗 ============ */
.overlay{
  position:fixed;inset:0;z-index:60;
  background:rgba(90,60,40,.42);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;
  padding:22px;
}
.overlay.show{display:flex;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.card{
  position:relative;
  background:#fffdf8;border-radius:26px;
  padding:26px;width:100%;max-width:660px;max-height:86vh;overflow:auto;
  box-shadow:0 28px 64px rgba(80,50,30,.34);
  animation:pop .3s cubic-bezier(.2,1.3,.5,1);
}
@keyframes pop{from{transform:scale(.92) translateY(14px);opacity:0}to{transform:none;opacity:1}}

.close{
  position:absolute;right:16px;top:16px;
  width:34px;height:34px;border-radius:50%;border:none;
  background:#f6e6d6;color:#a98d78;font-size:16px;cursor:pointer;
  display:grid;place-items:center;transition:.15s;
}
.close:hover{background:#efd8c2;transform:rotate(90deg)}

.card-head{
  display:flex;align-items:center;gap:10px;
  font-size:17px;font-weight:800;margin-bottom:16px;color:#7a5c46;
}
.card-head .stamp{
  margin-left:auto;font-size:11px;color:#b39a85;font-weight:500;
  border:2px dashed #e6cdb4;border-radius:8px;padding:4px 9px;
}

/* 信件 */
.letter{
  background:
    repeating-linear-gradient(180deg, transparent 0 31px, #f2e3d1 31px 32px),
    #fffaf2;
  border:1px solid #f2e3d1;border-radius:16px;
  padding:20px 22px;font-size:15px;line-height:32px;
  white-space:pre-wrap;color:#6b5140;
}
.letter-from{
  margin-top:16px;font-size:13px;color:#a98d78;
  display:flex;align-items:center;gap:6px;
}

/* 礼物 */
.gift-box{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 0 4px}
.gift-emoji{
  font-size:74px;line-height:1;
  animation:giftFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 12px 14px rgba(180,130,95,.28));
}
@keyframes giftFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.gift-name{font-size:20px;font-weight:800;margin-top:14px;color:#7a5c46}
.gift-desc{font-size:14px;color:#a0846d;line-height:1.8;max-width:420px}
.gift-from{
  margin-top:16px;font-size:13px;color:#a98d78;
  background:#f8ecdf;border-radius:999px;padding:6px 16px;
}

/* 地图 */
.map-box{
  position:relative;width:100%;aspect-ratio:2/1;
  border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#ddf0ff,#c9e6ff);
  box-shadow:inset 0 0 30px rgba(120,170,210,.25);
}
.map-box svg{width:100%;height:100%;display:block}
.pin{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  animation:pinIn .45s backwards cubic-bezier(.2,1.4,.5,1);
}
@keyframes pinIn{from{opacity:0;transform:translate(-50%,-30%) scale(.4)}to{opacity:1}}
.pin .head{
  width:26px;height:26px;border-radius:50%;background:#fff;
  display:grid;place-items:center;font-size:15px;
  border:2px solid #ffb3c1;
  box-shadow:0 3px 8px rgba(90,60,40,.28);
}
.pin .label{
  font-size:10px;background:rgba(255,255,255,.92);
  padding:1px 6px;border-radius:7px;white-space:nowrap;color:#6b5140;
  box-shadow:0 1px 4px rgba(90,60,40,.15);
}
.map-empty{
  position:absolute;inset:0;display:grid;place-items:center;
  color:#7fa3bd;font-size:14px;font-weight:600;text-align:center;padding:20px;
}
.map-foot{margin-top:14px;font-size:13px;color:#a98d78;text-align:center}

/* ============ 响应式 ============ */
@media (max-width:900px){
  .app{flex-direction:column-reverse;align-items:center;gap:18px}
  .panel{width:100%;flex-direction:row;flex-wrap:wrap;position:static;gap:10px}
  .brand{width:100%;justify-content:center;padding-bottom:0}
  .btn{flex:1;min-width:140px}
}
@media (max-width:560px){
  body{padding:16px 10px 40px}
  .house{transform:scale(.74);transform-origin:top center;margin-bottom:-168px}
  .panel{flex-direction:column}
  .btn{min-width:0}
  .gift-emoji{font-size:58px}
}
</style>
</head>
<body>

<div class="app">
  <!-- 左侧按钮 -->
  <aside class="panel">
    <div class="brand"><span class="paw">🐾</span> 旅行小猫</div>

    <button class="btn" id="btnLetter">
      <span class="ico">💌</span>
      <span><b>小猫的信</b><small>它不在家时写的信</small></span>
    </button>

    <button class="btn" id="btnGift">
      <span class="ico">🎁</span>
      <span><b>小猫的礼物</b><small>从远方带回来的</small></span>
    </button>

    <button class="btn" id="btnMap">
      <span class="ico">🗺️</span>
      <span><b>旅行地图</b><small>它去过的地方</small></span>
    </button>
  </aside>

  <!-- 房子 -->
  <main class="stage">
    <div class="house" id="house">
      <!-- 二楼 -->
      <div class="floor up" id="upFloor">
        <div class="window">
          <span class="moon"></span>
          <span class="star" style="left:18%;top:32%"></span>
          <span class="star" style="left:72%;top:20%"></span>
          <span class="star" style="left:44%;top:66%"></span>
        </div>
        <div class="wallpic">🐟</div>
        <div class="rug"></div>

        <div class="bed">
          <div class="bed-head"></div>
          <div class="bed-mattress"></div>
          <div class="bed-blanket"></div>
          <div class="bed-pillow"></div>
        </div>

        <div class="mirror">
          <div class="mirror-glass"></div>
          <div class="mirror-foot"></div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- 一楼 -->
      <div class="floor down" id="downFloor">
        <div class="rug small"></div>

        <div class="vanity">
          <div class="vanity-mirror"></div>
          <div class="vanity-top"></div>
          <div class="vanity-drawer"><i></i><i></i></div>
          <div class="vanity-legs"><i></i><i></i></div>
          <div class="bottle"></div>
        </div>

        <div class="chair">
          <div class="chair-back"></div>
          <div class="chair-seat"></div>
          <div class="chair-legs"><i></i><i></i></div>
        </div>

        <div class="plant">🪴</div>
      </div>
    </div>

    <div class="status">
      <span class="pulse"></span>
      <span id="statusText">…</span>
    </div>
  </main>
</div>

<!-- 弹窗 -->
<div class="overlay" id="overlay">
  <div class="card" id="card">
    <button class="close" id="closeBtn">✕</button>
    <div id="cardContent"></div>
  </div>
</div>

<script>

/* =========================================================
   页面初始化：随机状态
========================================================= */
const VISITED_KEY = 'travel-cat-visited-v1';
let visited = [];
try { visited = JSON.parse(localStorage.getItem(VISITED_KEY) || '[]'); } catch(e){ visited = []; }

let currentState, currentPlace = null;

function init(){
  currentState = pick(STATES);

  if(currentState.key === 'travel'){
    const notVisited = PLACES.filter(p => !visited.includes(p.name));
    currentPlace = pick(notVisited.length ? notVisited : PLACES);
    if(!visited.includes(currentPlace.name)){
      visited.push(currentPlace.name);
      try{ localStorage.setItem(VISITED_KEY, JSON.stringify(visited)); }catch(e){}
    }
  }

  renderCat();
  renderStatus();
}

function renderCat(){
  document.querySelectorAll('.cat-wrap, .zzz, .suitcase').forEach(el => el.remove());

  if(currentState.key === 'travel'){
    const bag = document.createElement('div');
    bag.className = 'suitcase';
    bag.textContent = '🧳';
    $('#downFloor').appendChild(bag);
    return;
  }

  const pos = CAT_POS[currentState.key];
  const floorEl = pos.floor === 'up' ? $('#upFloor') : $('#downFloor');

  const wrap = document.createElement('div');
  wrap.className = 'cat-wrap' + (currentState.key === 'sleep' ? ' sleep' : '');
  wrap.style.left   = pos.left + 'px';
  wrap.style.bottom = pos.bottom + 'px';
  wrap.style.width  = pos.size + 'px';
  wrap.innerHTML = catSVG(currentState.key);

  if(currentState.key === 'sleep'){
    wrap.innerHTML += '<span class="zzz z1">z</span><span class="zzz z2">z</span><span class="zzz z3">z</span>';
  }

  floorEl.appendChild(wrap);
}

function renderStatus(){
  if(currentState.key === 'travel' && currentPlace){
    $('#statusText').textContent =
      `小猫出门旅行啦 —— 它现在在 ${currentPlace.name} ${currentPlace.emoji}`;
  } else {
    $('#statusText').textContent = currentState.tip;
  }
}

/* =========================================================
   弹窗基础
========================================================= */
const overlay = $('#overlay');
const cardContent = $('#cardContent');

function openCard(html){
  cardContent.innerHTML = html;
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeCard(){
  overlay.classList.remove('show');
  document.body.style.overflow = '';
}
$('#closeBtn').addEventListener('click', closeCard);
overlay.addEventListener('click', e => { if(e.target === overlay) closeCard(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeCard(); });

   1. 小猫的信
========================================================= */
function randomDate(){
  const d = new Date(Date.now() - Math.floor(Math.random() * 40) * 86400000);
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

$('#btnLetter').addEventListener('click', () => {
  const place = pick(PLACES);
  const tpl = pick(LETTERS);
  const text = tpl
    .replace(/\{place\}/g, place.name)
    .replace(/\{food\}/g,  pick(FOODS))
    .replace(/\{thing\}/g, pick(THINGS));

  openCard(`
    <div class="card-head">
      <span style="font-size:22px">💌</span> 小猫的信
      <span class="stamp">${randomDate()} · 邮戳 🐾</span>
    </div>
    <div class="letter">${text}</div>
    <div class="letter-from">📍 寄自 ${place.name} ${place.emoji}</div>
  `);
});

$('#btnMap').addEventListener('click', () => {
  const pins = visited.map((name, i) => {
    const p = PLACES.find(x => x.name === name);
    if(!p) return '';
    const isNow = currentPlace && currentPlace.name === name;
    return `<div class="pin" style="left:${p.x/10}%;top:${p.y/5}%;animation-delay:${i*0.06}s">
      <span class="head">${isNow ? '🐱' : '🐾'}</span>
      <span class="label">${p.name}</span>
    </div>`;
  }).join('');

  const empty = visited.length === 0
    ? `<div class="map-empty">小猫还趴在窗台上，哪儿都没去呢～<br>下次再来看看吧 🐾</div>`
    : '';

  openCard(`
    <div class="card-head">
      <span style="font-size:22px">🗺️</span> 小猫的旅行地图
      <span class="stamp">已点亮 ${visited.length} 个地方</span>

      ${empty}

});
